<div class="webrtc-player-root">
  <video data-role="video" autoplay playsinline muted></video>
  <div class="controls">
    <label>串流網址:</label>
    <span data-role="whep-url">{{data.[0].[0].webrtc-url}}</span>
    <span data-role="status">自動連線中...</span>
    <span data-role="api-base-url" style="display:none">{{data.[0].[0].api-base-url}}</span>
    <span data-role="api-base-url-1" style="display:none">{{data.[0].[0].api-base-url-1}}</span>
    <span data-role="rtsp-url" style="display:none">{{data.[0].[0].rtsp-url}}</span>
    <span data-role="service-name" style="display:none">{{data.[0].[0].service-name}}</span>

  </div>
</div>
