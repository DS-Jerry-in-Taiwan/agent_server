events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # 服務前端靜態頁面與 JS、CSS
        location /via-2.x.y/ {
            alias /usr/share/nginx/html/via-2.x.y/;
            autoindex on;
        }

        # 服務圖片（img 目錄）
        location /img/ {
            alias /usr/share/nginx/html/img/;
            autoindex on;
        }

        # API 統一代理
        location /api/ {
            proxy_pass http://localhost:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # 你可以依需求增加更多 API 路由
    }
}