events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # 服務截圖圖片（本機 img 目錄）
        location /img/ {
            proxy_pass http://10.223.81.69:5000/img/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 反向代理 ROI 編輯頁面到 agent 主機
        location /via/ {
            proxy_pass http://10.223.81.69:5000/via/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API 反向代理到 agent 主機
        location /api/ {
            proxy_pass http://10.223.81.69:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}