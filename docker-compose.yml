version: '3.8'

services:
  agent-server:
    build:
      context: agent/.
    container_name: agent-server
    network_mode: host
    ports:
      - "5000:5000"
    volumes:
      - ./img:/home/ubuntu/agent_server/img
      - ./via:/home/ubuntu/agent_server/via
      - /home/ubuntu/projects/pedestrianinsight/PaddleDetection/deploy/pipeline/config:/home/ubuntu/agent_server/roi_configs
    environment:
      - TZ=Asia/Taipei
    restart: unless-stopped

