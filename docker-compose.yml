version: '3.8'

services:
  agent-server:
    build:
      context: .
    container_name: agent-server
    network_mode: host
    ports:
      - "5000:5000"
    volumes:
      - ./img:/home/ubuntu/agent-server-roi/img
      - ./via:/home/ubuntu/agent-server-roi/via
      - ${roi_config_dir}:/home/ubuntu/agent-server-roi/roi_configs
    environment:
      - TZ=Asia/Taipei
    restart: unless-stopped

  